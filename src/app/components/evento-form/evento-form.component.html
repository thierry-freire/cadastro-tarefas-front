<section class="page-shell">
  <mat-card class="form-card">
    <div class="form-header">
      <div>
        <h1>{{ isEditing ? 'Editar evento' : 'Cadastrar evento' }}</h1>
        <p>{{ isEditing ? 'Atualize os dados do evento.' : 'Preencha os dados para criar um novo evento.' }}</p>
      </div>
      <button mat-stroked-button color="primary" routerLink="/">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </button>
    </div>

    <div *ngIf="loading" class="loading-state" role="status" aria-live="polite">
      <mat-spinner diameter="28"></mat-spinner>
      <span>{{ isEditing ? 'Carregando evento...' : 'Salvando evento...' }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="event-form">
      <mat-form-field appearance="outline">
        <mat-label>Título</mat-label>
        <input matInput formControlName="titulo" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descrição</mat-label>
        <textarea matInput formControlName="descricao" rows="4" required></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data e hora</mat-label>
        <input matInput type="datetime-local" formControlName="data" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Local</mat-label>
        <input matInput formControlName="local" required />
      </mat-form-field>

      <div class="actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="loading">
          {{ isEditing ? 'Salvar alterações' : 'Cadastrar evento' }}
        </button>
      </div>
    </form>

    <div class="feedback feedback-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>
    <div class="feedback feedback-success" *ngIf="successMessage" role="status">{{ successMessage }}</div>
  </mat-card>
</section>
