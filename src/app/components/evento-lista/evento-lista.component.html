<section class="panel list-panel">
  <div class="list-header">
    <h2>Eventos cadastrados</h2>
    <a routerLink="/events/new" class="button-link">Novo evento</a>
  </div>

  <div *ngIf="loading" class="empty-state">Carregando...</div>
  <div *ngIf="!loading && eventos.length === 0" class="empty-state">Nenhum evento cadastrado ainda.</div>

  <div *ngIf="!loading && eventos.length > 0" class="event-list">
    <article class="event-card" *ngFor="let evento of eventos">
      <div>
        <h3>{{ evento.titulo }}</h3>
        <p>{{ evento.descricao }}</p>
        <small>{{ evento.local }} • {{ evento.data | date:'dd/MM/yyyy HH:mm' }}</small>
      </div>
      <div class="card-actions">
        <a class="button-link small" [routerLink]="['/events', evento.id]">Editar</a>
        <button type="button" class="danger" (click)="deleteEvento(evento.id)">Excluir</button>
      </div>
    </article>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button type="button" (click)="changePage(-1)" [disabled]="page === 0">Anterior</button>
    <span>Página {{ page + 1 }} de {{ totalPages }}</span>
    <button type="button" (click)="changePage(1)" [disabled]="page + 1 >= totalPages">Próxima</button>
  </div>

  <div class="feedback" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="feedback success" *ngIf="successMessage">{{ successMessage }}</div>
</section>
