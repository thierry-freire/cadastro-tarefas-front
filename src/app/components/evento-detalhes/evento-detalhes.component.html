<section class="page-shell">
  <mat-card class="detail-card">
    <mat-toolbar color="primary" class="toolbar">
      <div>
        <h1>Detalhes do evento</h1>
        <p>Veja as informações completas do evento selecionado.</p>
      </div>
      <button mat-flat-button color="accent" routerLink="/events">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </button>
    </mat-toolbar>

    <div *ngIf="loading" class="loading-state" role="status" aria-live="polite">
      <mat-spinner diameter="28"></mat-spinner>
      <span>Carregando detalhes...</span>
    </div>

    <div *ngIf="errorMessage" class="feedback feedback-error" role="alert">{{ errorMessage }}</div>

    <div *ngIf="evento && !loading" class="detail-content">
      <h2>{{ evento.titulo }}</h2>
      <p class="description">{{ evento.descricao }}</p>

      <mat-chip-set>
        <mat-chip>{{ evento.local }}</mat-chip>
        <mat-chip>{{ evento.data | date:'dd/MM/yyyy HH:mm' }}</mat-chip>
      </mat-chip-set>

      <div class="actions">
        <a mat-flat-button color="primary" [routerLink]="['/events', evento.id, 'edit']">
          <mat-icon>edit</mat-icon>
          Editar
        </a>
        <button mat-flat-button color="warn" type="button" (click)="deleteEvento(evento.id)">Excluir</button>
      </div>
    </div>
  </mat-card>
</section>
